name: D-Scalp Bot 247

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Restaurar cache de estado de alertas
        uses: actions/cache@v4
        with:
          path: estado_bot.json
          key: dscalp-state-${{ github.run_id }}
          restore-keys: |
            dscalp-state-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerias necesarias
        run: pip install requests pandas numpy

      - name: Ejecutar Bot D-Scalp V3.7
        run: python bot.py
