name: D-Scalp Bot 247

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      origen:
        description: 'Modo de ejecucion (manual / auto)'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: dscalp-bot-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias necesarias
        run: pip install -q requests pandas numpy urllib3 openpyxl

      - name: Ejecutar Bot D-Scalp V3.8.6
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event.inputs.origen == 'auto' && 'schedule' || github.event_name }}
        run: python bot.py

      - name: Persistir estado de alertas y bitacora Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f estado_bot.json ]; then
            git add estado_bot.json
          fi
          if [ -f bitacora_dscalp.csv ]; then
            git add bitacora_dscalp.csv
          fi
          if [ -f Bitacora_DScalp_PRO.xlsx ]; then
            git add Bitacora_DScalp_PRO.xlsx
          fi
          git diff --staged --quiet || (git commit -m "chore: update bot state and pro excel journal [skip ci]" && git pull --rebase origin ${{ github.ref_name }} && git push)
